name: Deploy verified production fork
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published source revision
        required: true
        type: string
      build_run_id:
        description: Successful publication run ID
        required: true
        type: string
      build_run_attempt:
        description: Publication attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: securo-production-deploy
  cancel-in-progress: false
jobs:
  deploy-production:
    if: >-
      vars.SECURO_PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.repository == 'Jascuas/securo' &&
      github.ref == 'refs/heads/codex/tensor' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out trusted request client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Connect scoped ephemeral production node
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_SECURO_PRODUCTION_CLIENT_ID }}
          audience: ${{ secrets.TS_SECURO_PRODUCTION_AUDIENCE }}
          tags: tag:securo-ci-deploy-production
          version: 1.102.4
          sha256sum: 50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9
          hostname: securo-production-${{ github.run_id }}-${{ github.run_attempt }}
          log-mode: quiet
      - name: Verify production CI cannot reach unrelated private services
        env:
          DENIED_ENDPOINTS: ${{ secrets.SECURO_PRODUCTION_DENIED_ENDPOINTS }}
        run: python3 -B .github/scripts/release_network.py
      - name: Request selected production release and reconcile final receipt
        env:
          RELEASE_APP: securo-production
          RELEASE_ORIGIN: ${{ vars.SECURO_PRODUCTION_RELEASE_ORIGIN }}
          CONFIG_SHA256: ${{ vars.SECURO_PRODUCTION_CONFIG_SHA256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          RELEASE_DEPLOY_TOKEN: ${{ secrets.SECURO_PRODUCTION_DEPLOY_TOKEN }}
          RELEASE_READ_TOKEN: ${{ secrets.SECURO_PRODUCTION_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_client.py
